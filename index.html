<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hospital Bed Management</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app">

<header>
<h1>🏥 Hospital Bed Management</h1>
</header>

<main>

<div class="stats">
<b>Total Beds<br>
<span id="total">20</span>
</b>

<b>Free Beds<br>
<span id="free">20</span>
</b>
</div>

<section>
<h2>Patient Admission</h2>

<input id="name" placeholder="Patient Name">
<input id="pid" placeholder="Patient ID">
<input id="ward" placeholder="Ward">

<button onclick="admit()">Admit Patient</button>
<button onclick="discharge()">Discharge Patient</button>

<p id="msg"></p>
</section>

<section>
<h2>Patient Records</h2>

<button class="export" onclick="csv()">Export Report</button>

<table>
<thead>
<tr>
<th>Name</th>
<th>Patient ID</th>
<th>Ward</th>
<th>Bed</th>
</tr>
</thead>

<tbody id="rows"></tbody>
</table>

</section>

<section>
<h2>Bed Map</h2>
<div id="beds" class="beds"></div>
</section>

</main>

</div>

<script src="app.js"></script>

</body>
</html>
