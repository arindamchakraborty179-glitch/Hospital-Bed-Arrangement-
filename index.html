<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hospital Bed Management</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app">

    <h1>Hospital Bed Management</h1>

    <!-- Statistics -->
    <div class="stats">

        <div class="stat total">
            <b>Total Beds</b>
            <span id="total">20</span>
        </div>

        <div class="stat free">
            <b>Free Beds</b>
            <span id="free">20</span>
        </div>

        <div class="stat occupied">
            <b>Occupied</b>
            <span id="occupied">0</span>
        </div>

    </div>


    <!-- Patient Admission -->
    <div class="admission">

        <input
            id="name"
            type="text"
            placeholder="Patient Name"
        >

        <input
            id="pid"
            type="text"
            placeholder="Patient ID"
        >

        <select id="ward">
            <option value="Emergency">Emergency</option>
            <option value="General">General</option>
            <option value="ICU">ICU</option>
            <option value="Cabin">Cabin</option>
        </select>

        <button class="admit" onclick="admit()">
            Admit
        </button>

        <button class="discharge" onclick="discharge()">
            Discharge
        </button>

    </div>


    <!-- Patient Records -->
    <section>

        <div class="section-title">
            <h2>Patient Records</h2>

            <button class="export" onclick="csv()">
                Export Report
            </button>
        </div>

        <table id="records">

            <thead>
                <tr>
                    <th>Name</th>
                    <th>Patient ID</th>
                    <th>Ward</th>
                    <th>Bed</th>
                </tr>
            </thead>

            <tbody>
            </tbody>

        </table>

    </section>


    <!-- Bed Map -->
    <section>

        <h2>Bed Map</h2>

        <div id="beds" class="beds"></div>

    </section>

</div>


<script src="app.js"></script>

</body>
</html>
