<!doctype html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hospital Bed Management</title><link rel="stylesheet" href="style.css"></head>
<body>
<div id="login" class="login"><div class="box"><h1>🏥 Hospital Bed Management</h1><input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password"><button onclick="login()">Login</button><p id="err"></p></div></div>
<div id="app" hidden><header><h1>Hospital Bed Management 🏥</h1><button onclick="logout()">Logout</button></header>
<main><div class="stats"><b>Total Beds<br><span id="total">20</span></b><b>Free Beds<br><span id="free">20</span></b><b>Occupied<br><span id="occ">0</span></b></div>
<section><h2>Patient Admission</h2><input id="name" placeholder="Patient Name"><input id="pid" placeholder="Patient ID"><select id="ward"><option value="">Select Ward</option><option>ICU</option><option>General</option><option>Emergency</option></select><button onclick="admit()">Admit</button><button class="red" onclick="discharge()">Discharge Selected</button><p id="msg"></p></section>
<section><h2>Patient Records <button class="export" onclick="csv()">Export Report</button></h2><table><thead><tr><th>Name</th><th>ID</th><th>Ward</th><th>Bed</th></tr></thead><tbody id="rows"></tbody></table><small>Click a patient row to select it for discharge.</small></section>
<section><h2>Bed Map</h2><div id="beds" class="beds"></div></section></main></div>
<script src="script.js"></script></body></html>
